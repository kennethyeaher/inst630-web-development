name: Collection checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_collection.py
  projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [04-rsvp-interaction, 05-array-methods, 06-async-directory, 07-external-libraries]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
