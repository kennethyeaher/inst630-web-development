<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">HTML Letter Lab</title>
  <desc id="description">HTML Letter Lab. A supplied letter marked up to spec, then an original letter designed from scratch. Two paper sheets: the course letter with a blue rule, and the Correspondence companion with an aubergine top bar.</desc>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="#efedf4" stroke="#d5cfdf"/>
  <text x="96" y="128" fill="#282337" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="58">HTML Letter Lab</text>
  <text x="98" y="180" fill="#282337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23">A supplied letter, marked up to spec.</text>
  <text x="98" y="212" fill="#282337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23">Then an original letter, designed from scratch.</text>
  <text x="98" y="256" fill="#56376d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">INST630 · SEMANTIC HTML · PRINT READY</text>
  <g transform="translate(800 64) rotate(-4 80 104)">
    <rect width="160" height="208" rx="4" fill="#ffffff" stroke="#d5cfdf"/>
    <rect x="16" y="18" width="18" height="22" rx="2" fill="#282337"/>
    <rect x="96" y="22" width="48" height="5" rx="2.5" fill="#8a8597"/>
    <rect x="108" y="32" width="36" height="5" rx="2.5" fill="#8a8597"/>
    <rect x="16" y="60" width="128" height="3" fill="#2c5aa0"/>
    <rect x="16" y="72" width="96" height="8" rx="2" fill="#2c5aa0"/>
    <rect x="16" y="94" width="128" height="4" rx="2" fill="#d5cfdf"/>
    <rect x="16" y="104" width="120" height="4" rx="2" fill="#d5cfdf"/>
    <rect x="16" y="114" width="128" height="4" rx="2" fill="#d5cfdf"/>
    <rect x="16" y="130" width="110" height="4" rx="2" fill="#d5cfdf"/>
    <rect x="16" y="140" width="124" height="4" rx="2" fill="#d5cfdf"/>
    <text x="16" y="194" fill="#8a8597" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" letter-spacing="1">COURSE LETTER</text>
  </g>
  <g transform="translate(948 44) rotate(3 90 116)">
    <rect width="180" height="232" rx="4" fill="#ffffff" stroke="#d5cfdf"/>
    <rect width="180" height="6" fill="#56376d"/>
    <text x="18" y="70" fill="#282337" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="19">Bring something</text>
    <text x="18" y="96" fill="#282337" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="19">worth repairing.</text>
    <rect x="18" y="114" width="140" height="4" rx="2" fill="#d5cfdf"/>
    <rect x="18" y="124" width="128" height="4" rx="2" fill="#d5cfdf"/>
    <rect x="18" y="142" width="144" height="44" rx="2" fill="#f1eaf6"/>
    <rect x="28" y="154" width="40" height="5" rx="2.5" fill="#56376d"/>
    <rect x="28" y="168" width="90" height="4" rx="2" fill="#a99bb8"/>
    <text x="18" y="214" fill="#56376d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" letter-spacing="1">CORRESPONDENCE</text>
  </g>
