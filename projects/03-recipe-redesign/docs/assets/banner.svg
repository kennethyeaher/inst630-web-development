<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Kenneth's Kitchen</title>
  <desc id="description">Kenneth's Kitchen. A loud course starter recipe card, redesigned into a calm, checkable recipe page. A checkered towel border frames a checklist of ingredients, two already checked.</desc>
  <defs>
    <pattern id="towel" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fffdf8"/>
      <rect width="8" height="8" fill="#e7edf8"/>
      <rect x="8" y="8" width="8" height="8" fill="#e7edf8"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="#fffdf8" stroke="#d9dfeb"/>
  <text x="96" y="132" fill="#2445a0" font-family="Georgia,'Times New Roman',serif" font-size="60">Kenneth's Kitchen</text>
  <text x="98" y="182" fill="#202b43" font-family="Arial,Helvetica,sans-serif" font-size="23">A loud starter recipe card, redesigned into</text>
  <text x="98" y="214" fill="#202b43" font-family="Arial,Helvetica,sans-serif" font-size="23">a calm page you can cook from.</text>
  <text x="98" y="258" fill="#2445a0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3">INST630 · GRID AND FLEXBOX · CHECKLIST · PRINT STYLES</text>
  <rect x="820" y="48" width="292" height="224" rx="6" fill="url(#towel)"/>
  <rect x="836" y="64" width="260" height="192" rx="4" fill="#fffdf8"/>
  <text x="856" y="100" fill="#2445a0" font-family="Georgia,'Times New Roman',serif" font-size="22">Ingredients</text>
  <rect x="856" y="110" width="220" height="2" fill="#2445a0"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202b43">
    <rect x="856" y="128" width="16" height="16" rx="3" fill="#2445a0"/>
    <path d="M860 136l3 3l6 -6" fill="none" stroke="#fffdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="882" y="141" fill="#8a92a6" text-decoration="line-through">2¼ cups flour</text>
    <rect x="856" y="160" width="16" height="16" rx="3" fill="#2445a0"/>
    <path d="M860 168l3 3l6 -6" fill="none" stroke="#fffdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="882" y="173" fill="#8a92a6" text-decoration="line-through">1 tsp baking soda</text>
    <rect x="856.75" y="192.75" width="14.5" height="14.5" rx="3" fill="#fffdf8" stroke="#202b43" stroke-width="1.5"/>
    <text x="882" y="205">1 cup butter, softened</text>
    <rect x="856.75" y="224.75" width="14.5" height="14.5" rx="3" fill="#fffdf8" stroke="#202b43" stroke-width="1.5"/>
    <text x="882" y="237">2 cups chocolate chips</text>
  </g>
</svg>
